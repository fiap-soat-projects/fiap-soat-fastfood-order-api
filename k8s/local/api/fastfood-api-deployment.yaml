apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastfood-order-api
  namespace: fiap
  labels:
    app: fastfood-order-api
spec:
  selector:
    matchLabels:
      app: fastfood-order-api
  template:
    metadata:
      labels:
        app: fastfood-order-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: fastfood-order-api
          image: jefersondsgomes/fiap-soat-fastfood-order-api:latest
          imagePullPolicy: IfNotPresent
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          ports:
            - name: http
              containerPort: 8080
          env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name            
          envFrom:
            - configMapRef:
                name: fastfood-order-api
            - secretRef:
                name: fastfood-order-api
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"